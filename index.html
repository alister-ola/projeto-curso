<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · [Sua Marca]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">[Sua Marca]</a>
      <a class="text-link" href="#">Precisa de ajuda?</a>
    </div>
  </header>

  <main id="conteudo" class="login">
    <div class="container login__grid">
      <div class="login__intro">
        <p class="eyebrow">[NOME DO CURSO]</p>
        <h1 class="display">Seu próximo passo começa aqui.</h1>
        <p class="lead">Entre na sua área de membros para assistir às aulas, baixar os materiais e acompanhar o seu progresso.</p>
      </div>

      <section class="card login__card" aria-labelledby="titulo-entrar">
        <h2 id="titulo-entrar">Entrar</h2>
        <p class="login__card-sub">Use o e-mail da sua matrícula.</p>

        <!-- Sem autenticação real: o botão apenas leva para curso.html.
             Os campos não têm "name", então nada do que for digitado vai para a URL. -->
        <form class="form" action="curso.html" method="get">
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="email" autocomplete="email" inputmode="email">
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" type="password" autocomplete="current-password">
          </div>

          <button class="btn btn--primary btn--block" type="submit">Acessar o curso</button>

          <div class="form__links">
            <a class="text-link" href="#">Esqueci minha senha</a>
            <a class="text-link" href="#">Primeiro acesso?</a>
          </div>
        </form>
      </section>

      <figure class="testimonial">
        <blockquote>
          <p>“[DEPOIMENTO CURTO DE UM ALUNO]”</p>
        </blockquote>
        <figcaption>[Nome do aluno], [profissão]</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
